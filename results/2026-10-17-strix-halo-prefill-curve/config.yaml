# Functional input for an estimate. Not a performance measurement.
date: 2026-10-17
purpose: >-
  Measure the shape of prefill time against prompt length for NVIDIA-Nemotron-Nano-9B-v2,
  and check the attention shape assumed by the restore-versus-recompute estimate
  (../2026-10-15-restore-vs-recompute-estimate) against the model's config.json.
device:
  name: Strix Halo (Ryzen AI Max+ 395), Radeon 8060S Graphics
  arch: gfx1151
  integrated: true      # SGLang sizes memory from system available RAM
  shared: true          # other users' containers on the same host; no other GPU process at start
software:
  image: rocm/sgl-dev:v0.5.21-rocm724-gfx1151-20261008
  sglang: commit 9f5d8712514c2d9dd29c76c6080774db3fd50aa2 (the image's source)
model:
  name: NVIDIA-Nemotron-Nano-9B-v2 (bf16)
  source: ModelScope mirror nv-community/NVIDIA-Nemotron-Nano-9B-v2
server_args:
  tp_size: 1
  max_mamba_cache_size: 16
  mem_fraction_static: 0.186        # sized to about 23 GiB of the host's available memory
  attention_backend: triton
  mamba_backend: triton
  moe_runner_backend: triton        # default resolves to flashinfer_cutlass on ROCm
  chunked_prefill_size: 8192
  max_running_requests: 1
  context_length: 70000
env:
  SGLANG_DISABLE_LEAN_ATTENTION: "1"
source_patches: >-
  The two temporary patches of ../2026-10-14-strix-halo-mamba2-extra-buffer-kl/local.patch
  (Mamba2 causal_conv1d binding and ReLU2 on ROCm), applied for the run and reverted.
measurement:
  lengths: [1024, 2048, 4096, 8192, 16384, 32768, 65536]
  repetitions: 3                    # ascending, descending, ascending
  warmup: [256, 1024]
  request: >-
    /generate with fresh random token ids (seeded), max_new_tokens 1, temperature 0, one
    request at a time, after POST /flush_cache; cached_tokens was 0 for every request.
  metric: end-to-end request time measured by the client
