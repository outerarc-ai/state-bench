# Functional check only. Not a performance measurement.
date: 2026-10-14
purpose: >-
  Run SGLang's Mamba2 extra_buffer KL test (decode- and prefill-seeded cache hits must
  match cold recompute) on gfx1151 for correctness.
device:
  name: Strix Halo (Ryzen AI Max+ 395), Radeon 8060S Graphics
  arch: gfx1151
  integrated: true      # SGLang sizes memory from system available RAM
  shared: true          # other users' containers ran on the same host
software:
  image: rocm/sgl-dev:v0.5.21-rocm724-gfx1151-20261008
  sglang: 0.5.22.dev542+g9f5d87125 (commit 9f5d8712514c2d9dd29c76c6080774db3fd50aa2)
  torch: 2.9.1+rocm7.2.4
  triton: 3.7.0+amd.rocm7.2.0
model:
  name: NVIDIA-Nemotron-Nano-9B-v2 (bf16)
  source: ModelScope mirror nv-community/NVIDIA-Nemotron-Nano-9B-v2 (Hugging Face unreachable from the container)
  mamba_state_per_slot: 136.9 MiB   # spec-derived from config: 27 Mamba layers, 128x80 heads, state 128, fp32 SSM
server_args:
  tp_size: 1
  max_mamba_cache_size: 96          # upstream 256
  mem_fraction_static: 0.39         # upstream 0.8; sized to keep this server under 40 GiB
  mamba_radix_cache_strategy: extra_buffer
  mamba_track_interval: 128
  attention_backend: triton
  mamba_backend: triton
  moe_runner_backend: triton        # default resolves to flashinfer_cutlass; see summary
  chunked_prefill_size: 4096        # resolved by SGLang
  max_running_requests: 19          # capped by the state pool (5 slots per request)
env:
  SGLANG_DISABLE_LEAN_ATTENTION: "1"
  SGLANG_ENABLE_RANK_CONSENSUS_CHECKER: "1"   # as upstream
source_patches: local.patch          # applied in the container for the run, then reverted
test:
  file: test_mamba2_extra_buffer_kl_local.py (generated by run.sh from upstream test_mamba2_extra_buffer_kl.py)
  kl_div_thres: 0.005               # decode cache hit, as upstream
  kl_div_thres_prefill: 0.012       # prefill cache hit, as upstream
  kl_div_max_samples: 16
  inputs: >-
    Offline stand-in for the test's default inputs: 48 prompts of 1500-4500 tokens
    (uniform 0.5x-1.5x of 3000, random.Random(0)) cut from the container's Python 3.12
    standard library; input file sha256 prefix 9cfc48ebe4fd7a59. See prepare.sh.
scripts: [prepare.sh, run.sh]
