# Measured on real hardware. Single node, development machine. Ad-hoc record:
# not produced by state-bench tooling, no run.sh regeneration (see ../README.md).
date: 2026-10-13
purpose: >-
  Qwen-Image 2.1 (diffusion) performance optimization on SGLang Diffusion /
  ROCm: Cache-DiT step-cache tuning frontier, ROCm-specific switches and
  offload, kernel hotspot structure, and the bit-exact Triton SiLU-mul
  fusion PR for HIP.
device:
  name: AMD Ryzen AI MAX 395 (Strix Halo), Radeon 8060S iGPU
  arch: gfx1151
  memory: unified ~93 GB; GTT/TTM cap ~47 GiB
software:
  image: rocm/sgl-dev:v0.5.21-rocm724-gfx1151-20261008
  rocm: 7.2.4
  torch: 2.9.1+rocm7.2.4
  sglang: editable install at /sgl-workspace/sglang (multimodal_gen)
  cache_dit: 1.3.0
model: Qwen-Image 2.1
fixed_conditions:
  seed: 42
  steps: 40
  cfg: 1
  attention_backend: torch_sdpa   # AOTriton; only stable backend on this device
  flags: [--dit-layerwise-offload, --text-encoder-cpu-offload, --pin-cpu-memory]
timing: >-
  Stage-level Pixel total (Encoding + Denoising + Decoding, excluding model
  load); per-step = Denoising / steps.
quality: PSNR recomputed with Pillow (hudi/scripts/compute_psnr.py)
non_determinism: >-
  Run-to-run noise floor: two identical no-cache runs give PSNR ~60.3 dB
  (not inf); below 60 dB is noise, not a regression.
reproduction: >-
  Scripts and raw evidence live outside this repo (pr-rocm-silu-fusion/
  scripts, evidence/ logs and images on the dev machine); see summary.md §6.
